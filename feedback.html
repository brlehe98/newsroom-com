<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Newsroom – Feedback</title>
<style>
  :root { color-scheme: light dark; --text: #1d1d1f; --muted: #5f6368; --bg: #ffffff; --line: #d9d9de; --accent: #1a56c4; --card: #f5f5f7; }
  @media (prefers-color-scheme: dark) { :root { --text: #f2f2f7; --muted: #a1a1a6; --bg: #1c1c1e; --line: #3a3a3c; --accent: #8cb4ff; --card: #2c2c2e; } }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 28px; margin: 0 0 4px; }
  .muted { color: var(--muted); }
  a { color: var(--accent); }
  .choices { display: grid; gap: 12px; margin: 24px 0; }
  .choice { display: block; padding: 16px 18px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--text); text-decoration: none; }
  .choice:hover { border-color: var(--accent); }
  .choice strong { display: block; font-size: 18px; }
</style>
</head>
<body>
<main>
<p class="muted"><a href="./">Privacy policy</a></p>

<section>
<h1>Newsroom – Feedback</h1>
<p>Found a problem or have an idea? Tell us.</p>
<div class="choices">
  <a class="choice" href="https://github.com/brlehe98/newsroom-com/issues/new?template=bug.yml"><strong>Report a bug</strong><span class="muted">Something does not work as it should.</span></a>
  <a class="choice" href="https://github.com/brlehe98/newsroom-com/issues/new?template=suggestion.yml"><strong>Suggest an idea</strong><span class="muted">Something that would help your team.</span></a>
</div>
</section>

</main>
</body>
</html>
