name: Suggest an idea
description: An idea to make Newsroom, Gather or Commons better.
title: "Idea: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: app
    attributes:
      label: App
      options:
        - Newsroom
        - Gather
        - Commons
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like, and how would it help your community?
    validations:
      required: true
